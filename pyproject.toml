[project]
name = "lms-api"
version = "0.1.0"
description = "Learning Management System (LMS) REST API built with FastAPI, SQLAlchemy 2.0, and Alembic"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "black>=26.10.1",
    "fastapi[standard]>=0.162.2",
    "gunicorn>=23.0.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.10.0",
    "sentry-sdk>=2.75,<3",
    "sqlalchemy[asyncio]>=2.1.8",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions/bcb073ef043a_create_users_table.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
