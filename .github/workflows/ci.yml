name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --python 3.12

      - name: Check Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run mypy type check
        run: uv run mypy app

  test:
    name: Database Migrations & Test Suite
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lms_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lms_test
      SECRET_KEY: ci-secret-key-minimum-32-characters-long
      JWT_SECRET_KEY: ci-jwt-secret-key-minimum-32-characters-long
      RATE_LIMIT_ENABLED: "false"
      SENTRY_DSN: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --python 3.12

      - name: Verify Alembic migrations lifecycle (upgrade -> downgrade -> upgrade -> check)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      - name: Run pytest with test coverage gate
        run: |
          uv run pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=85

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  docker-build:
    name: Container Build & Validation
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lms-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container entrypoint
        run: |
          docker run --rm \
            -e DATABASE_URL="postgresql+asyncpg://postgres:postgres@localhost:5432/lms" \
            -e SECRET_KEY="ci-container-secret-key-minimum-32-chars" \
            -e JWT_SECRET_KEY="ci-container-jwt-secret-key-min-32-chars" \
            lms-api:ci-test python -c "import app.main; print('App module imported successfully')"
          docker run --rm lms-api:ci-test alembic --help > /dev/null
          CONTAINER_ID=$(docker run -d --rm -p 18000:8000 \
            -e ENVIRONMENT="production" \
            -e DATABASE_URL="postgresql+asyncpg://postgres:postgres@localhost:5432/lms" \
            -e SECRET_KEY="ci-container-secret-key-minimum-32-chars" \
            -e JWT_SECRET_KEY="ci-container-jwt-secret-key-min-32-chars" \
            lms-api:ci-test)
          trap "docker stop $CONTAINER_ID >/dev/null 2>&1 || true" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18000/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/health | grep -q '"status":"ok"'
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18000/sentry-debug)
          test "$STATUS_CODE" = "404"
